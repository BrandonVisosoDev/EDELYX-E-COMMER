# ===================================================================
# CONFIGURACION DEL SERVIDOR Y APLICACION
# ===================================================================
spring.application.name=gateway
server.port=8080

# ===================================================================
# CONFIGURACION DE EUREKA CLIENT
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:9000/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===================================================================
# CONFIGURACION DE RUTAS (SPRING CLOUD GATEWAY WEBFLUX)
# ===================================================================
# Microservicio de Catalogo - Productos
spring.cloud.gateway.server.webflux.routes[0].id=ms-catalog-products
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CatalogService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

# Microservicio de Catalogo - Categorias
spring.cloud.gateway.server.webflux.routes[1].id=ms-catalog-categories
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CatalogService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categories/**

# Microservicio de Ordenes
spring.cloud.gateway.server.webflux.routes[2].id=ms-orders
spring.cloud.gateway.server.webflux.routes[2].uri=lb://OrderService
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

# ===================================================================
# DESCUBRIMIENTO AUTOMATICO VIA EUREKA
# ===================================================================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ===================================================================
# CONFIGURACION GLOBAL DE CORS (ANGULAR FRONTEND)
# ===================================================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.['/**'].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.['/**'].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.['/**'].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.['/**'].allow-credentials=true
