<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg">
  <!-- Nivel 1: Barra Principal -->
  <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4 max-w-7xl">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 group">
      <div
        class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-md group-hover:scale-105 transition-transform"
      >
        E
      </div>
      <div>
        <span class="text-xl font-black tracking-wider text-white">EDELYX</span>
        <span class="text-xs text-emerald-400 font-semibold block -mt-1 tracking-widest uppercase"
          >E-Commer</span
        >
      </div>
    </a>

    <!-- Buscador Integrado con Categoría -->
    <div
      class="flex-1 max-w-2xl mx-4 hidden md:flex items-center bg-slate-800/90 border border-slate-700/80 rounded-xl overflow-hidden focus-within:border-emerald-500 transition-colors"
    >
      <!-- Selector de Categoría -->
      <select
        [ngModel]="selectedCategoryId()"
        (ngModelChange)="selectedCategoryId.set($event); onFilterChange()"
        class="bg-slate-850 text-slate-300 text-xs px-3 py-2.5 border-r border-slate-700 outline-none cursor-pointer hover:text-white"
      >
        <option value="">Todas las categorías</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>

      <!-- Input de Búsqueda -->
      <input
        type="text"
        placeholder="Buscar productos por nombre, SKU..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        (keyup.enter)="onFilterChange()"
        class="w-full bg-transparent text-sm text-white px-4 py-2 outline-none placeholder-slate-500"
      />

      <!-- Botón Buscar -->
      <button
        (click)="onFilterChange()"
        class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-5 py-2.5 transition flex items-center justify-center cursor-pointer font-bold"
      >
        <i class="pi pi-search"></i>
      </button>
    </div>

    <!-- Acciones Derecha (Pedidos y Carrito) -->
    <div class="flex items-center gap-5">
      <!-- Rastrear Pedido -->
      <a
        routerLink="/orders"
        class="text-xs text-slate-300 hover:text-white flex flex-col items-start leading-tight"
      >
        <span class="text-slate-400">Consultar</span>
        <span class="font-bold">Mis Pedidos</span>
      </a>

      <!-- Botón Carrito con Badge -->
      <button
        class="relative bg-slate-800 hover:bg-slate-750 border border-slate-700 text-white p-2.5 rounded-xl transition cursor-pointer flex items-center gap-2"
      >
        <i class="pi pi-shopping-cart text-lg text-emerald-400"></i>
        <span class="hidden sm:inline text-xs font-bold">Carrito</span>

        <!-- Contador -->
        <span
          class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[11px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-lg"
        >
          {{ cartCount() }}
        </span>
      </button>
    </div>
  </div>

  <!-- Nivel 2: Sub-Barra Horizontal de Categorías Rápidas -->
  <div class="bg-slate-950/80 border-t border-slate-800/60 px-4 py-1.5 hidden sm:block">
    <div
      class="container mx-auto flex items-center gap-6 text-xs text-slate-400 max-w-7xl overflow-x-auto"
    >
      <button
        (click)="selectedCategoryId.set(''); onFilterChange()"
        [class.text-emerald-400]="selectedCategoryId() === ''"
        class="hover:text-white transition font-medium whitespace-nowrap cursor-pointer flex items-center gap-1"
      >
        <i class="pi pi-th-large text-[10px]"></i> Todo el Catálogo
      </button>

      @for (cat of categories(); track cat.id) {
        <button
          (click)="selectedCategoryId.set(cat.id.toString()); onFilterChange()"
          [class.text-emerald-400]="selectedCategoryId() === cat.id.toString()"
          class="hover:text-white transition whitespace-nowrap cursor-pointer"
        >
          {{ cat.name }}
        </button>
      }
    </div>
  </div>
</header>
